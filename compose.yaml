services:
  miaomiaowu:
    build: .
    image: miaomiaowu-x-independent:local
    ports:
      - "${MMX_HOST_PORT:-8080}:45300"
    environment:
      MMX_EXTERNAL_ORIGIN: "${MMX_EXTERNAL_ORIGIN:?Set the actual browser origin, e.g. http://your-server:8080}"
    volumes:
      - mmx_data:/app/data
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 20s
    restart: "no"
volumes:
  mmx_data:
