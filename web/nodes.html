<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>节点管理 · 妙妙屋 X</title><link rel="stylesheet" href="/manage/assets/bandwidth-form.css"><link rel="stylesheet" href="/manage/assets/bandwidth-live.css"><link rel="stylesheet" href="/manage/assets/plans.css"><script defer src="/manage/assets/nodes-model.js"></script><script defer src="/manage/assets/nodes-http.js"></script><script defer src="/manage/assets/nodes.js"></script></head>
<body><main><header><p class="eyebrow">妙妙屋 X <span>独立管理</span></p><h1>节点管理</h1><p class="muted">管理节点名称和所属服务器。基础记录创建后，仍需单独配置协议。</p><nav aria-label="管理页面"><a href="/manage/servers">服务器管理</a><a href="/manage/nodes" aria-current="page">节点管理</a><a href="/manage/plans">套餐管理</a><a href="/manage/bandwidth">节点带宽设置</a></nav></header>
<section aria-labelledby="auth-title"><h2 id="auth-title">管理员授权</h2><form id="auth-form"><label for="admin-token">管理员 API 凭据</label><input class="credential" id="admin-token" type="password" autocomplete="off" spellcheck="false" maxlength="128" required aria-describedby="auth-help"><p id="auth-help" class="hint">凭据仅在当前页面内存中使用；授权后清空输入框。切换页面需重新授权。</p><div class="actions"><button id="authorize" type="submit">授权并验证</button><button id="forget" class="secondary" type="button">清除当前授权</button></div></form><p id="auth-status" role="status">请先授权。</p></section>
<section aria-labelledby="list-title"><h2 id="list-title">节点列表</h2><label for="node-list">选择节点</label><select id="node-list" disabled><option value="">请先授权</option></select><p id="list-status" role="status">授权后读取节点与服务器。</p><p class="hint">选择节点、新建或重新读取会替换当前草稿。</p><div class="actions"><button id="refresh-nodes" class="secondary" type="button" disabled>刷新列表</button><button id="new-node" class="secondary" type="button" disabled>新建节点</button><button id="reload-node" class="secondary" type="button" disabled>重新读取节点</button></div></section>
<form id="plan-form" novalidate><h2 id="editor-title">新建节点</h2><p id="node-status" role="status">授权后可新建或选择节点。</p><p id="form-error" class="error" role="alert"></p><fieldset id="plans-fields" disabled><label for="node-name">节点名称</label><input id="node-name" type="text" maxlength="240" required autocomplete="off" aria-describedby="name-help form-error"><p id="name-help" class="hint">1–120 个字符，首尾空白会去除。</p><label for="server-list">所属服务器</label><select id="server-list" aria-describedby="server-help form-error"><option value="">请选择服务器</option></select><p id="server-help" class="hint">编辑所属服务器会迁移该节点的基础归属；共享节点不能迁移，已配置节点仍受端口冲突检查。</p><div class="actions"><button id="save-node" type="submit">创建节点</button></div></fieldset></form>
</main></body></html>
