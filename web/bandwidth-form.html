<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>带宽设置 · 妙妙屋 X</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="bandwidth-form.css">
  <script defer src="field-values.js"></script>
  <script defer src="bandwidth-form.js"></script>
</head>
<body>
  <main>
    <header><p class="eyebrow">妙妙屋 X <span>本地交互预览</span></p><h1>带宽设置</h1>
      <p class="muted">使用示例配置。生成预览不会保存或更改任何服务器设置。</p></header>
    <form id="bandwidth-form" novalidate>
      <fieldset class="mode"><legend>设置来源</legend>
        <label><input type="radio" name="source" value="inherit">继承上级设置</label>
        <label><input type="radio" name="source" value="override">单独设置</label>
        <p class="hint">继承使用上级规则；单独设置中的“不限速”是明确覆写。</p>
      </fieldset>
      <div class="directions">
        <fieldset id="upload-group"><legend>上传</legend>
          <label for="upload-kind">上传方式</label>
          <select id="upload-kind"><option value="limited">限速</option><option value="unlimited">不限速</option></select>
          <label for="upload-rate">上传上限 <span class="muted">（Mbps）</span></label>
          <input id="upload-rate" type="text" inputmode="decimal" autocomplete="off" spellcheck="false" maxlength="64" aria-describedby="rate-help upload-error">
          <p id="upload-error" class="error" aria-live="polite"></p>
        </fieldset>
        <fieldset id="download-group"><legend>下载</legend>
          <label for="download-kind">下载方式</label>
          <select id="download-kind"><option value="limited">限速</option><option value="unlimited">不限速</option></select>
          <label for="download-rate">下载上限 <span class="muted">（Mbps）</span></label>
          <input id="download-rate" type="text" inputmode="decimal" autocomplete="off" spellcheck="false" maxlength="64" aria-describedby="rate-help download-error">
          <p id="download-error" class="error" aria-live="polite"></p>
        </fieldset>
      </div>
      <p id="rate-help" class="hint">请输入正数 Mbps；0 不表示不限速或继承。最小值为 0.000008 Mbps，最大值为 8589.934592 Mbps，换算后须为整数字节/秒。</p>
      <p id="form-errors" class="error" role="alert"></p>
      <div class="actions"><button type="submit">生成保存预览</button><button type="reset" class="secondary">恢复示例配置</button></div>
      <p id="form-status" class="hint" role="status"></p>
    </form>
    <section id="preview" hidden aria-labelledby="preview-title"><h2 id="preview-title">待保存设置</h2><p id="preview-text"></p><p class="hint">仅预览，尚未保存。</p></section>
  </main>
</body>
</html>
