<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>服务器管理 · 妙妙屋 X</title><link rel="stylesheet" href="/manage/assets/bandwidth-form.css"><link rel="stylesheet" href="/manage/assets/bandwidth-live.css"><link rel="stylesheet" href="/manage/assets/plans.css"><script defer src="/manage/assets/servers-model.js"></script><script defer src="/manage/assets/servers-http.js"></script><script defer src="/manage/assets/servers.js"></script></head>
<body><main><header><p class="eyebrow">妙妙屋 X <span>独立管理</span></p><h1>服务器管理</h1><p class="muted">管理服务器基础名称。创建记录后，仍需单独完成 Agent 安装与接入。</p><nav aria-label="管理页面"><a href="/manage/servers" aria-current="page">服务器管理</a><a href="/manage/nodes">节点管理</a><a href="/manage/plans">套餐管理</a><a href="/manage/bandwidth">节点带宽设置</a></nav></header>
<section aria-labelledby="auth-title"><h2 id="auth-title">管理员授权</h2><form id="auth-form"><label for="admin-token">管理员 API 凭据</label><input class="credential" id="admin-token" type="password" autocomplete="off" spellcheck="false" maxlength="128" required aria-describedby="auth-help"><p id="auth-help" class="hint">凭据仅在当前页面内存中使用；授权后清空输入框。切换页面需重新授权。</p><div class="actions"><button id="authorize" type="submit">授权并验证</button><button id="forget" class="secondary" type="button">清除当前授权</button></div></form><p id="auth-status" role="status">请先授权。</p></section>
<section aria-labelledby="list-title"><h2 id="list-title">服务器列表</h2><label for="server-list">选择服务器</label><select id="server-list" disabled><option value="">请先授权</option></select><p id="list-status" role="status">授权后读取服务器。</p><p class="hint">选择服务器、新建或重新读取会替换当前草稿。</p><div class="actions"><button id="refresh-servers" class="secondary" type="button" disabled>刷新列表</button><button id="new-server" class="secondary" type="button" disabled>新建服务器</button><button id="reload-server" class="secondary" type="button" disabled>重新读取服务器</button></div></section>
<form id="plan-form" novalidate><h2 id="editor-title">新建服务器</h2><p id="server-status" role="status">授权后可新建或选择服务器。</p><p id="form-error" class="error" role="alert"></p><fieldset id="plans-fields" disabled><label for="server-name">服务器名称</label><input id="server-name" type="text" maxlength="240" required autocomplete="off" aria-describedby="name-help form-error"><p id="name-help" class="hint">1–120 个字符，首尾空白会去除。</p><div class="actions"><button id="save-server" type="submit">创建服务器</button></div></fieldset></form>
</main></body></html>
